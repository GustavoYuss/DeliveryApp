<header th:fragment="header">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/styles/barStyles.css" />
    <!-- Libreria de google maps -->
    <script src="https://maps.googleapis.com/maps/api/js?key=NoaHay&libraries=places&callback=initMap" async defer></script>

    <div class="container">
        <div class="options-bar-icon">
            <i class="fa-solid fa-bars"></i>
        </div>
        <div class="logo">
            <h1>Delivery <span>Eats</span></h1>
        </div>
        <div class="option-bar">
            <div class="option active">Entrega a domicilio</div>
            <div class="option">Recolectar</div>
        </div>
        <div class="currentDetails">
            <div class="header-option" onclick="showMap()">
                <i data-feather="map-pin"></i>
                <span class="space-right">Ubicación: Xalapa, Veracruz.</span>
                <i class="fa-solid fa-chevron-down"></i>
            </div>
        </div>
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <label>
                <input type="text" placeholder="Buscar en Delivery Eats" class="search-input">
            </label>
        </div>
        <div class="cart-icon">
            <i class="fa fa-shopping-cart"></i>
            <span class="notification">0</span>
        </div>
        <div class="login-buttons">
            <button class="options-btn selected" onclick="redirectToLogin()">
                <span>Iniciar Sesión</span>
            </button>
            <button class="options-btn">
                <span>Registrarme</span>
            </button>
        </div>
    </div>

    <!-- Modal del mapa -->
    <div id="mapModal" style="display: none;">
        <div id="mapContainer">
            <!-- Barra de búsqueda de lugares -->
            <input id="searchInput" type="text" placeholder="Buscar lugares..." />

            <!-- Contenedor del mapa -->
            <div id="map"></div>

            <!-- Botón para cerrar el mapa -->
            <button id="closeMapBtn" onclick="closeMap()">Cerrar</button>
        </div>
    </div>


</header>

<script src="/js/bar.js"></script>
