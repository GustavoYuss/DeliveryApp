<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text = "${product.getName()}"></title>
    <link rel="stylesheet" href="/styles/detailsStyles.css">
</head>
<body>
    <div th:replace="fragments/bar :: header"></div>
    <div class="containerProduct">
        <a href="#" class="back-link" th:text="'← ' + ${product.getIdRestaurant().getNameRestaurant()}"/>
        <div class="product-section">
            <div class="image-container">
                <img src="https://www.paulinacocina.net/wp-content/uploads/2023/05/receta-pollo-frito-crujiente.jpg" alt="Pollo" class="product-image">
            </div>
            <div class="product-details">
                <h1 th:text = "${product.getName()}"></h1>
                <p class="price"  th:text = "'MX$ ' + ${product.getNormalPrice().toString()}"></p>
                <p class="description" th:text = "${product.getDescription()}"></p>
                <div class="likes">
                    <span>#1 más elogiado</span> <span th:text="'👍 ' + ${review} + '%'"/>
                </div>
                <div class="order-section">
                    <select class="quantity-select">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                    </select>
                    <button class="order-button"  th:text = "'Añadir 1 a la orden • MX$ ' + ${product.getNormalPrice()}"/>
                </div>
            </div>
        </div>
        
        <div class="frequently-bought">
            <h2>Comunmente comprados juntos</h2>
            <div class="product-grid">
                <div class="product-card" th:each="dish: ${dishes}">
                    <p th:text="${dish.getName()}"></p>
                    <p class="small-price" th:text="'MX$ ' + ${dish.getNormalPrice().toString()} +  ' • 👍' + ${review} + '%'"/>
                    <button class="add-button">+</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
