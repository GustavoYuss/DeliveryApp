<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fucking Eats Home</title>
    <link rel="stylesheet" href="/styles/indexStyles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>

<div th:insert="~{fragments/bar :: header}"></div>

<section class="category-container">
    <button class="arrow-btn left-arrow" id="leftArrow">
        <i class="fa-solid fa-arrow-left"></i>
    </button>
    <div class="category-list" id="categoryList"></div>
    <button class="arrow-btn right-arrow" id="rightArrow">
        <i class="fa-solid fa-arrow-right"></i>
    </button>
</section>



<section class="ads-section">
    <button class="arrow-btn arrow-left">&#9664;</button>
    <div class="ads-carousel" id="ads"></div>
    <button class="arrow-btn arrow-right">&#9654;</button>
</section>



<section id="restaurants" >

    <!-- Parte de las mas puntuadas -->
    <div class="restaurants-Section" id="mas-puntuadas">
        <div class="header">
            <div class="header-title">
                <h2 class="subtitle-restaurants">Mayor Calificación</h2>
                <span>Las mejores calificaciones y un servicio excelente en todo momento.</span>
            </div>
        </div>

        <button class="arrow-btn left-arrow-restaurants" id="arrow1">&#9664;</button>
        <div class="restaurants-carousel" id="topRestaurants"></div>
        <button class="arrow-btn right-arrow-restaurants" id="arrow2">&#9654;</button>
    </div>

    <!-- Parte de las mas bara -->
    <div class="restaurants-Section" id="mas-bara">
        <div class="header">
            <div class="header-title">
                <h2 class="subtitle-restaurants">Buenas comidas a excelentes precios</h2>
                <span>Las mejores calificaciones y un precio muy razonable.</span>
            </div>
        </div>

        <button class="arrow-btn left-arrow-restaurants" id="leftArrow2" >&#9664;</button>
        <div class="restaurants-carousel" id="Cheap"></div>
        <button class="arrow-btn right-arrow-restaurants" id="rightArrow2">&#9654;</button>
    </div>

    <div class="restaurants-All-Section">
        <div class="header">
            <h2>Todos los Restaurantes</h2>
        </div>

        <div class="restaurants-table" id="restaurantsTable"></div>
    </div>
</section>

<script th:inline="javascript">
    var authenticatedUser = /*[[${authenticatedUser}]]*/ {};
</script>

<script src="/js/index.js"></script>
<script src="/js/bar.js"></script>

</body>
</html>
